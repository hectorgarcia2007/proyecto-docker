services:
 db:
 image: mysql:8.4
 restart: unless-stopped
 environment:
 MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Define MYSQL_ROOT_PASSWORD}
 MYSQL_DATABASE: ${MYSQL_DATABASE:-tareas}
 MYSQL_USER: ${MYSQL_USER:?Define MYSQL_USER}
 MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Define MYSQL_PASSWORD}
 volumes:
 - mysql_data:/var/lib/mysql
 - ./app/sql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
 networks:
 - backend
 healthcheck:
 test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p"$${MYSQL_ROOT_PASSWORD}" --silent"]
 interval: 10s
 timeout: 5s
 retries: 10
 start_period: 30s
 web:
 build:
 context: .
 dockerfile: apache/Dockerfile
 restart: unless-stopped
 environment:
 DB_HOST: db
 DB_NAME: ${MYSQL_DATABASE:-tareas}
 DB_USER: ${MYSQL_USER}
 DB_PASSWORD: ${MYSQL_PASSWORD}
 depends_on:
 db:
 condition: service_healthy
 networks:
 - backend
 healthcheck:
 test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1/health.php') === 'ok' ? 0 : 1);"]
 interval: 15s
 timeout: 5s
 retries: 5
 start_period: 20s
 nginx:
 image: nginx:1.27-alpine
 restart: unless-stopped
 ports:
 - "80:80"
 volumes:
 - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
 depends_on:
 web:
 condition: service_healthy
 networks:
 - frontend
 - backend
 phpmyadmin:
 image: phpmyadmin:5
 restart: unless-stopped
 environment:
 PMA_HOST: db
 PMA_PORT: 3306
 UPLOAD_LIMIT: 32M
 ports:
 - "127.0.0.1:${PMA_PORT:-8081}:80"
 depends_on:
 db:
 condition: service_healthy
 networks:
 - backend
volumes:
 mysql_data:
networks:
 frontend:
 backend:
 internal: true
